<VirtualHost *:80>
    ServerName enchentesvaledocai.com.br
    ServerAlias www.enchentesvaledocai.com.br
    Redirect permanent / https://enchentesvaledocai.com.br/
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName enchentesvaledocai.com.br
    ServerAlias www.enchentesvaledocai.com.br

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/enchentesvaledocai.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/enchentesvaledocai.com.br/privkey.pem

    ProxyPreserveHost On
    ProxyAddHeaders On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    ProxyPass / http://127.0.0.1:3000/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:3000/

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/enchentesvaledocai-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/enchentesvaledocai-ssl-access.log combined
</VirtualHost>
</IfModule>
