<VirtualHost *:80>
    ServerName enchentesvaledocai.com.br
    ServerAlias www.enchentesvaledocai.com.br

    ProxyPreserveHost On
    ProxyAddHeaders On
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"
    ProxyPass / http://127.0.0.1:3000/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/enchentesvaledocai-error.log
    CustomLog ${APACHE_LOG_DIR}/enchentesvaledocai-access.log combined
</VirtualHost>
